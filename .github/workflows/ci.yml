name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qa_pass
          POSTGRES_DB: qa_results
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HEADLESS: "1"
      QA_ENV: github-actions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Create results tables
        run: psql "postgresql://postgres:qa_pass@localhost:5433/qa_results" -f db/schema.sql

      - name: Run Playwright and Selenium tests
        run: pytest -v --html=report.html --self-contained-html

      - name: Results summary from PostgreSQL
        if: always()
        run: psql "postgresql://postgres:qa_pass@localhost:5433/qa_results" -f db/queries.sql

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: report.html

  api-tests-restassured:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Run REST Assured tests
        run: mvn -B test
        working-directory: api_restassured

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restassured-report
          path: api_restassured/target/surefire-reports

  api-tests-postman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman collection
        run: newman run api_postman/restful-booker.postman_collection.json -r cli,htmlextra --reporter-htmlextra-export newman-report.html

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-report
          path: newman-report.html

  soap-tests-soapui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Download SoapUI
        run: |
          for v in 5.10.0 5.9.1; do
            if curl -fsSL -o soapui.tar.gz "https://dl.eviware.com/soapuios/$v/SoapUI-$v-linux-bin.tar.gz"; then
              echo "Using SoapUI $v"
              echo "SOAPUI_VERSION=$v" >> "$GITHUB_ENV"
              break
            fi
          done
          tar -xzf soapui.tar.gz

      - name: Run SoapUI test suite
        run: |
          chmod +x