name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qa_pass
          POSTGRES_DB: qa_results
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HEADLESS: "1"
      QA_ENV: github-actions
      QA_DB_HOST: localhost
      QA_DB_PORT: "5433"
      QA_DB_NAME: qa_results
      QA_DB_USER: postgres
      QA_DB_PASSWORD: qa_pass
      PGPASSWORD: qa_pass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Create results tables
        run: psql -h localhost -p 5433 -U postgres -d qa_results -f db/schema.sql

      - name: Run UI tests
        run: pytest -v --html=report.html --self-contained-html

      - name: Show result analysis
        if: always()
        run: psql -h localhost -p 5433 -U postgres -d qa_results -f db/queries.sql

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: report.html

  api-tests-restassured:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Run REST Assured tests
        working-directory: api_restassured
        run: mvn -B test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restassured-reports
          path: api_restassured/target/surefire-reports

  api-tests-postman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman collection
        run: |
          newman run api_postman/restful-booker.postman_collection.json \
            --env-var "baseUrl=https://automationintesting.online" \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-report.html

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.html

  soap-tests-soapui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Download SoapUI
        run: |
          mkdir -p "$HOME/soapui"
          for v in 5.10.0 5.9.1; do
            if curl -fsSL -o soapui.tar.gz "https://dl.eviware.com/soapuios/$v/SoapUI-$v-linux-bin.tar.gz"; then
              tar -xzf soapui.tar.gz -C "$HOME/soapui"
              echo "Downloaded SoapUI $v"
              break
            fi
          done
          find "$HOME/soapui" -maxdepth 3 -name testrunner.sh

      - name: Run SoapUI test suite
        run: |
          TESTRUNNER=$(find "$HOME/soapui" -name testrunner.sh | head -n 1)
          if [ -z "$TESTRUNNER" ]; then
            echo "testrunner.sh not found"
            exit 1
          fi
          echo "Using $TESTRUNNER"
          chmod +x "$(dirname "$TESTRUNNER")"/*.sh
          "$TESTRUNNER" "-sCalculator Tests" -r -j "-fsoapui-reports" soap_soapui/Calculator-soapui-project.xml

      - name: Upload SoapUI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soapui-reports
          path: soapui-reports